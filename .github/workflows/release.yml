name: Release artifacts (manual, unpublished)
# Builds platform archives, SHA256SUMS and provenance.json and uploads them as
# workflow artifacts only. Nothing is published: no tag, GitHub Release,
# registry upload or attestation. See docs/RELEASING.md for the owner gates.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Archive version (MAJOR.MINOR.PATCH[-PRERELEASE])
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, os: darwin, arch: arm64 }
          - { runner: macos-15-intel, os: darwin, arch: amd64 }
          - { runner: ubuntu-latest, os: linux, arch: amd64 }
          - { runner: ubuntu-24.04-arm, os: linux, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ inputs.version }}
      TARGET_OS: ${{ matrix.os }}
      TARGET_ARCH: ${{ matrix.arch }}
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.0
      - run: go test ./...
      - run: go vet ./...
      - run: sh scripts/release/test.sh
      - name: Package host-native archive
        run: sh scripts/release/package.sh --version "$VERSION" --os "$TARGET_OS" --arch "$TARGET_ARCH" --out "$RUNNER_TEMP/dist"
      - name: Verify archive on its own platform
        # --require-run fails if the runner cannot execute the archive, so a
        # mislabelled runner cannot pass with a structure-only check.
        run: sh scripts/release/check-archive.sh --require-run "$RUNNER_TEMP/dist/luuna-beacon_${VERSION}_${TARGET_OS}_${TARGET_ARCH}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: luuna-beacon_${{ inputs.version }}_${{ matrix.os }}_${{ matrix.arch }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
      # OWNER GATE (disabled): build provenance attestation needs
      # `id-token: write` and `attestations: write` and stores a public record.
      # Enable only through the reviewed release process in docs/RELEASING.md.
      # - uses: actions/attest-build-provenance@v2
      #   with:
      #     subject-path: ${{ runner.temp }}/dist/*.tar.gz
