name: Component verification
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.0
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/luuna-beacon ./cmd/lbc ./cmd/lb
      - name: Reject tracked private artifacts
        run: |
          python3 - <<'PY'
          import subprocess, re
          paths = subprocess.check_output(['git', 'ls-files', '-z'], text=True).split('\0')
          bad = [p for p in paths if re.search(r'(^|/)(node_modules|\.pi|\.luuna)/|(^|/)\.env($|\.(?!example$))', p)]
          assert not bad, 'Private artifacts must not be tracked'
          PY
  verify-windows:
    # Same supported surface on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.0
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/luuna-beacon ./cmd/lbc ./cmd/lb
